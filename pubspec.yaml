name: dalbit_suwon
description: "수원화성 야간 데이트 코스 앱 — 달빛수원"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # 상태관리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 라우팅
  go_router: ^14.0.0

  # 모델 (불변 객체 + JSON 직렬화)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 이미지
  cached_network_image: ^3.4.1

  # 폰트 (Manrope, Hanken Grotesk)
  google_fonts: ^6.2.1

  # 외부 지도 딥링크
  url_launcher: ^6.3.1

  # 위치 (권한 요청 + 현재 위치)
  geolocator: ^14.0.3

  # 알림 권한 (푸시 알림 On/Off 판별 및 요청)
  permission_handler: ^11.3.1

  # 앱 버전 정보 (마이페이지 버전 표시 + 최신 버전 체크)
  package_info_plus: ^10.2.1

  # 최신 버전 확인용 (iTunes Lookup API 호출)
  http: ^1.2.0

  # 지도 SDK (OpenStreetMap 타일 기반, API 키 불필요)
  # 추후 카카오맵/네이버맵 SDK로 교체 가능. UI/Provider 계층은 유지.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # 로컬 저장 (게스트 상태의 찜 목록 등)
  shared_preferences: ^2.3.3

  # 인증
  supabase_flutter: ^2.9.0
  kakao_flutter_sdk_user: ^1.9.7
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6

  # 로깅
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 테스트: FavoriteRepositoryLocal의 SharedPreferencesAsync in-memory mock
  shared_preferences_platform_interface: ^2.4.2

  # 코드 생성
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/kakao/
    - assets/kakao/2.0x/
